# The vehicle for `lab check regional` (docs/testbed.md): vehicle.toml with a one-frame clip of the
# check's test card as the source and a small snapshot store for the pilot's box crops. Unknown keys are rejected.

# RTP/H.264 to the relay, inside WireGuard.
destination = "10.77.0.1:5004"
# Feedback: the relay answers probes here (docs/architecture.md, "Adaptation"). The rungs are in
# testbed/ladder.toml.
feedback = "10.77.0.1:5006"
# Test only: POST /video/pause, /video/freeze and /video/resume on the metrics endpoint, which
# `lab check qgc-status` uses to stall the source. Off (refused) unless set; never set it outside
# the testbed.
debug_hooks = true

# The relay's job API (docs/architecture.md, "Retained detail"): the vehicle polls it for requests for
# retained snapshots and crops, and uploads the answers over the overlay.
detail = "http://10.77.0.1:8080"

[source]
# The card's one-frame clip, which `lab check regional` writes to this volume (crates/lab/src/regional/card.rs);
# the sender starts over once a second until it can open it.
kind = "file"
path = "/snapshots/card.y4m"
# One frame, shown for good: no loop to restart.
still = true

# Retained snapshots, which the ground's crops of the pilot's box come from. The card sits in the same
# volume (96 MiB), so the store keeps only the last half minute within 3 MiB.
[snapshot]
fps = 1
quality = 90

[store]
dir = "/snapshots"
max_bytes = 3145728
max_age_s = 30
min_free_bytes = 1048576
gap_after_ms = 1500

# Regional video: the picture outside the pilot's box and the people found is softened in blocks of
# this many pixels on a side (2 to 4); without it (1) nothing is softened and the pilot's box is not
# kept. The limits (how long a region lasts, the detector's rate and score) are [region] of limits.toml.
[region]
soften_factor = 2

# MAVLink bridge (docs/testbed.md): SITL's serial 0 in this network namespace (a TCP autopilot must
# be on loopback, and control reaches it only once it reports the SITL marker parameter),
# mavlink-router's UDP server endpoint on the relay, inside WireGuard (only datagrams from it are
# read), and the control envelope endpoint on the vehicle's overlay address.
[mavlink]
autopilot = "tcpout:127.0.0.1:5760"
relay = "10.77.0.1:14550"
control = "10.77.0.2:7700"
# This vehicle's name. Every signed control message is made for it, so one signed for another vehicle
# is refused; the ground adapter's config (testbed/config/ground.toml) names the same one.
vehicle_id = "testbed"
# The only overlay addresses that may take the control lease: the ground adapter and the lab runner
# in checks, each with the public key its envelopes must be signed with (`just lab-keys` makes the
# pairs). The relay attests source addresses, not WireGuard end to end; the keys are what it lacks
# (docs/architecture.md).
controllers = [
    { address = "10.77.0.3", public_key = "/secrets/ctl-ground.pub" },
    { address = "10.77.0.4", public_key = "/secrets/ctl-checks.pub" },
]
# The testbed's containers read one kernel clock, so its bound is 0 (docs/measurement.md, "Clock
# assumption"). A vehicle on its own clock says "chrony".
clock = "shared"
