# mavlink-router v4 on the relay (docs/testbed.md). It only routes: the vehicle's gate, the
# telemetry budget and freshness live in the Rust applications. Message filters stay at their
# defaults (none), and settings not listed keep the v4 defaults.

[General]
# No TCP server; endpoints are the two below only.
TcpServerPort = 0

# The vehicle sends telemetry here inside WireGuard; mavlink-router replies to its source.
[UdpEndpoint vehicle]
Mode = Server
Address = 10.77.0.1
Port = 14550

# The ground adapter.
[UdpEndpoint ground]
Mode = Normal
Address = 10.77.0.3
Port = 14551

# The lab runner in checks, on its overlay address: vehicle telemetry that does not pass the ground
# adapter, so `lab check control-freshness` sees SITL while the adapter is down.
[UdpEndpoint checks]
Mode = Normal
Address = 10.77.0.4
Port = 14553
