# /etc/nftables.conf on the relay server. Everything is closed except SSH and WireGuard on the public
# interface; what arrives through the tunnel is allowed per peer and port. The job API has no
# authentication of its own, so the source address is what keeps the vehicle out of the ground's
# port and the ground out of the vehicle's.
# Only this table is replaced; the system's own rules stay. Docker runs with its iptables rules off
# (provision.sh), so its FORWARD drop cannot block the forwarding below.
table inet sat_teleop_relay
delete table inet sat_teleop_relay

table inet sat_teleop_relay {
    chain input {
        type filter hook input priority 0; policy drop;
        ct state established,related accept
        iifname "lo" accept
        ip protocol icmp accept
        # IPv6 needs neighbour and router discovery to keep any connectivity, SSH over IPv6 included.
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, echo-reply, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        # Replies from a provider's DHCP servers, for an address that is leased rather than static.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
        tcp dport 22 accept
        udp dport 51820 accept
        iifname "wg0" jump overlay
    }

    chain overlay {
        # The vehicle: video, probes, telemetry and the job API's poll.
        ip saddr 10.77.0.2 udp dport { 5004, 5006, 14550 } accept
        ip saddr 10.77.0.2 tcp dport 8080 accept
        # The ground: RTSP and the job API. Its raw MAVLink answers mavlink-router's telemetry from
        # the port that telemetry arrives on, so it travels as established traffic.
        ip saddr 10.77.0.3 tcp dport { 8554, 8081 } accept
    }

    # The vehicle and the ground talk to each other through the relay: the control envelopes
    # (UDP 7700 on the vehicle, 7701 on the ground) are forwarded between the two peers, and nothing
    # else is routed. The containers use host networking and need no forwarding of their own.
    chain forward {
        type filter hook forward priority 0; policy drop;
        iifname "wg0" oifname "wg0" ip saddr 10.77.0.3 ip daddr 10.77.0.2 udp dport 7700 accept
        iifname "wg0" oifname "wg0" ip saddr 10.77.0.2 ip daddr 10.77.0.3 udp dport 7701 accept
    }
}
