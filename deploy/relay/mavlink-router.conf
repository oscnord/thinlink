# mavlink-router on the relay: it only routes. The vehicle's gate, the telemetry budget and freshness
# live in the Rust applications.

[General]
TcpServerPort = 0

# The vehicle sends telemetry here inside WireGuard; mavlink-router replies to its source.
[UdpEndpoint vehicle]
Mode = Server
Address = 10.77.0.1
Port = 14550

# The ground adapter.
[UdpEndpoint ground]
Mode = Normal
Address = 10.77.0.3
Port = 14551
