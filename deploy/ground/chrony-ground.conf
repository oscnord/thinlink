# Linux ground machine only: add to /etc/chrony/conf.d/ and restart chrony. It lets the ground adapter's
# container read this machine's `chronyc tracking` over chronyd's command port, which answers read-only
# commands (tracking, sources) to the addresses named below and refuses everything that would change
# the clock ("501 Not authorised"). Set clock = { chrony_at = "host.containers.internal" } in ground.toml.
#
# Use the address the container reaches this machine at: `podman compose exec ground getent hosts
# host.containers.internal`. Keep the loopback addresses, or chronyc on this machine stops working.
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
# Podman's default bridge gateway; Docker's is 172.17.0.1.
bindcmdaddress 10.88.0.1
# The subnet the container's requests come from (Docker's default: 172.16.0.0/12), nothing wider.
cmdallow 10.88.0.0/16
# Check from the container:
#   podman compose exec ground chronyc -c -h host.containers.internal tracking
# and let the firewall pass UDP 323 from that subnet to this address.
