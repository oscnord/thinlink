# /etc/thinlink/vehicle.toml: the vehicle on a Raspberry Pi, a native binary under systemd.
# Written for a USB UVC webcam and a Pixhawk-class ArduPilot flight controller. Nothing here has run
# on hardware (docs/hardware.md#boards). Unknown keys are rejected.

# RTP/H.264 to the relay, inside WireGuard.
destination = "10.77.0.1:5004"
# The relay answers the adaptation probes here.
feedback = "10.77.0.1:5006"
# The relay's job API for retained snapshots (docs/drone.md#retained-detail).
detail = "http://10.77.0.1:8080"

# The board's H.264 encoder (v4l2h264enc) when it has one: a Pi Zero 2 W, 3 or 4. A Pi 5 has none and
# falls back to x264enc, which a small board may not keep up with. "x264" forces the software encoder.
encoder = "hardware"

[source]
# A USB webcam. `thinlink-vehicle probe-camera` lists the devices and the modes they offer; MJPEG
# is decoded here (the stamp needs raw pixels), YUYV needs only a conversion.
kind = "v4l2"
device = "/dev/video0"
format = "mjpeg"
width = 1280
height = 720
fps = 30
# A Raspberry Pi Camera Module through libcamera instead (Raspberry Pi OS Bookworm or later, package
# gstreamer1.0-libcamera):
# kind = "libcamera"
# width = 1280
# height = 720
# fps = 30

# One retained snapshot a second. The JPEG encode is the one costly extra on a small board: lower
# `quality` or remove this table and [store] to switch the branch off.
[snapshot]
fps = 1
quality = 75

[store]
dir = "/var/lib/thinlink/snapshots"
# 256 MiB, an hour, and 512 MiB left free on the card.
max_bytes = 268435456
max_age_s = 3600
min_free_bytes = 536870912
gap_after_ms = 1500

# Landing on a printed AprilTag (tag36h11), docs/real-vehicle.md, "Landing on a marker". Off by default.
# With it on the vehicle tells the autopilot where the tag is, and only while the camera looks straight
# down; it never moves the copter, the pilot chooses Land. It needs the picture's field of view, and
# either a fixed camera's tilt (exactly -90, straight down) or, without `tilt_deg`, a gimbal whose attitude
# the autopilot reports. Real mode also needs PLND_ENABLED 1, PLND_TYPE 1, PLND_YAW_ALIGN 0 (real32), PLND_STRICT 1, PLND_ALT_MIN 0 and PLND_ALT_MAX 0 in `require`.
# [camera]
# hfov_deg = 60
# tilt_deg = -90
# [landing]
# target = true
# tag_id = 0

[mavlink]
# SITL mode is the default and sends control nowhere on a real flight controller. Real mode sends it
# only while its interlocks hold (docs/real-vehicle.md); the required parameters are the operator's
# choice for the airframe, the list there is where to start:
# mode = "real"
# require = [
#     { name = "FS_GCS_ENABLE", type = "int8", value = 5 },
#     { name = "FS_GCS_TIMEOUT", type = "real32", value = 5 },
# ]
# Off by default. On, the lease holder may upload a waypoint mission and fly it in Auto, and a copter
# that loses the link finishes it by its own failsafe; real mode then also needs FS_OPTIONS, FENCE_ENABLE,
# FENCE_TYPE, FENCE_ALT_MAX, FENCE_ACTION and BATT_FS_LOW_ACT in `require` (docs/real-vehicle.md, "Missions flown out of reach").
# allow_missions = true
# A flight controller over USB, or the Pi's UART (/dev/serial0 at 921600 baud, the TELEM port with
# SERIALn_PROTOCOL=2 on the flight controller). Control reaches it only once it reports the SITL
# marker parameter, which a real autopilot never does: control goes to the logging sink.
autopilot = "serial:/dev/ttyACM0:115200"
# mavlink-router on the relay, inside WireGuard.
relay = "10.77.0.1:14550"
# The vehicle's control endpoint on its overlay address.
control = "10.77.0.2:7700"
# This vehicle's name. Every signed control message is made for it, so one signed for another vehicle
# is refused; ground.toml names the same one. Give each vehicle of a fleet its own.
vehicle_id = "vehicle-1"
# The only overlay addresses that may take the control lease: the ground adapter, with the public
# key its envelopes must be signed with (`just deploy-keys`; provision.sh installs it).
controllers = [{ address = "10.77.0.3", public_key = "/etc/thinlink/ctl-ground.pub" }]
# The bound on this clock's error, from `chronyc tracking`, reported to the ground (docs/real-vehicle.md).
clock = "chrony"
