# Installed as /etc/chrony/conf.d/sat-teleop.conf. The ground labels video LIVE only when it knows
# how far the two clocks can differ, so the vehicle's clock must be disciplined and its error
# bounded: the vehicle reads that bound from `chronyc tracking` every 2 s and reports it to the ground.
#
# Raspberry Pi boards have no battery-backed clock: step the clock at start, and again if it is
# off by more than a second in the first three updates.
makestep 1 3
# More sources make the bound tighter and more honest than one.
pool pool.ntp.org iburst maxsources 4
# Over a satellite or cellular link the first replies can be slow: do not give up early.
maxdistance 3.0
