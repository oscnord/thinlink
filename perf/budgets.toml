[control-freshness.lan]
status = "enforced"
rationale = """Runs 1793508728511, 1793508944411, 1793509160219 (e1d5edb), alternating with the geo and outage-10s runs. Container-only, ArduRover SITL under qemu, checks as second controller, ground station and observer. Worst measured: discrete ACK p50 20.2 ms (max 24.8 ms), Hold amid the setpoint stream acknowledged after 18.2 ms, setpoint delay p50 1 ms (max 4 ms), SITL throttle zero 1133 ms and Hold 3504 ms after the last setpoint, nothing applied from invalid envelopes. The vehicle's last refresh (424-427 ms) is held by the refresh_bounded assertion to the setpoint lifetime plus one tick, SITL's coast to standstill (6261-6443 ms) is recorded, not graded. Rule: delays and stop times 1.25 x worst + 10 ms rounded up to 5 ms; counts that were 0 stay 0; maxima recorded, not graded, as for the mavlink budgets."""
max = { discrete_ack_p50_ms = 40.0, stop_command_ack_ms = 35.0, setpoint_delay_p50_ms = 15.0, throttle_released_ms = 1430.0, hold_ms = 4390.0, invalid_applied = 0.0 }

