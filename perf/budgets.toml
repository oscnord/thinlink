[skeleton.geo]
status = "enforced"
rationale = """Runs 1793490233600, 1793490313562 (2642565); 1793490447594, 1793490506333, 1793490545949, 1793490586017, 1793490625363, 1793490665987 (33ef4e6); 1793490785205, 1793490825877, 1793490866102 (0a5a1f7); 1793491102044 (7054d8a); 1793492139627, 1793492179680 (df40c2a). Container-only, ball pattern at 640x360/15 fps/500 kbit/s. Only frame age and recovery are graded. The geo profile's per-packet jitter reorders packets; 0-20 per run arrive after the relay's 50 ms wait, are dropped without repair and break video until the next keyframe, so new frames per second (13.59-14.99), the longest gap (99-1272 ms) and the unreadable ratio (0-0.084) swing between runs. They are recorded but not graded: mending a broken picture before the next keyframe is open (docs/latency.md, "What was tried"). Worst measured: frame age p95 337 ms, max 351 ms, recovery frame age 338 ms (recovery 869-2321 ms). Rule: age limits 1.25 x worst + 10 ms rounded up to 5 ms; recovery waits for the next keyframe, so 1.25 x (2000 ms keyframe interval + worst recovery frame age) rounded up to 5 ms."""
max = { frame_age_p95_ms = 435.0, frame_age_max_ms = 450.0, video_recovery_ms = 2925.0 }

