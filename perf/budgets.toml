# Acceptance budgets for `lab check`, per scenario and profile: [<scenario>.<profile>].
# docs/testbed.md#verdicts-and-budgets defines the metrics and how budgets are graded.
#
# status = "calibration": measured and recorded, never graded; the run is incomplete (exit 2).
# status = "enforced": every limit in `max` and `min` is graded; an unmeasured metric is
# incomplete. An enforced budget cites the runs its limits come from in `rationale`.

[skeleton.lan]
status = "enforced"
rationale = """Age and gap limits use 1.25 x worst + 10 ms rounded up to 5 ms; unreadable ratio uses 1.25 x worst + 0.01; frame rate uses 0.95 x worst rounded down to 0.5; recovery uses 1.25 x (2000 ms keyframe interval + worst recovery frame age) rounded up to 5 ms. Container measurements at 640x360/15 fps/500 kbit/s: frame age p95 11 ms, maximum 39 ms, minimum 14.99 new frames/s, longest gap 105 ms, unreadable ratio 0 and worst recovery frame age 69 ms."""
max = { frame_age_p95_ms = 25.0, frame_age_max_ms = 60.0, max_frame_gap_ms = 145.0, unreadable_ratio = 0.01, video_recovery_ms = 2590.0 }
min = { new_frames_per_s = 14.0 }

