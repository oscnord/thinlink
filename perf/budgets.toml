[sim-flight.lan]
status = "enforced"
rationale = """Runs 1793584798866, 1793584899891, 1793585000330 (0812a9e with the check as committed in e0845d8). Container-only, the simulated flight (ArduCopter 4.7.2 SITL under qemu in Gazebo, `just sim-up`), checks as the ground station, a 10 m takeoff and an 8 s leg at 4 m/s in Loiter. Worst measured: Brake 965 ms after the vehicle's last applied setpoint (928-965), Land 2508 ms after it (2378-2508), on the ground and disarmed 30252 ms after it (29849-30252), a sag of 0.02 m while holding in Brake and 0.01 m before Land (both measured from the altitude when the setpoints stopped), the video 100 % Live over the leg in every run (age p50 5-6 ms, p95 7-9 ms, 15.4-16.0 new frames/s, recorded not graded). Rule: times 1.25 x worst + 10 ms rounded up to 5 ms; sags 1.25 x worst + 0.1 m (the altitude report's jitter) rounded up to 0.1 m; Live share 0.95 x worst rounded down to 0.01. The descent limit after Land begins is not a budget: it is 1.25 x ArduCopter's default WP_SPD_DN, in `land_verdict`."""
max = { brake_ms = 1220.0, brake_sag_m = 0.2, land_ms = 3145.0, land_sag_m = 0.2, on_ground_ms = 37825.0 }
min = { video_live_ratio = 0.95 }

