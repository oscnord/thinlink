[adaptation.bandwidth-steps]
status = "enforced"
rationale = """Runs 1793548366795, 1793548686388, 1793548986264 (cf21fa5), alternating with an lte-bad and a geo-degraded run, and 1793549731777 (91cfdcf; the vehicle's code on this path is the same, the check counts only drains that began during the observation, as computed from the vehicle's listed changes for the cf21fa5 runs). Container-only, ball pattern, the ladder settled at the top rung (1280x720/15 fps) before the timeline. Worst measured: the vehicle offered less than the new cap 2233 ms after a downward step (2191-2233 ms), no window over the cap after the settling deadline, the frame age back at its phase's level and its pace 7610 ms after the 512 to 128 kbit/s step (5441-7610 ms, the drain's pause included), that level 2 ms over the base (-6 to +2 ms), one drain per run that paused the video 3488-4188 ms, 4.5 rung changes per minute (3.0-4.5), a second viewer 4.2-6.1 % from one. Rule: times and what is left over the base 1.25 x worst + 10 ms rounded up to 5 ms; counts that were 0 stay 0; rung changes 1.25 x worst rounded up to 0.5; a second viewer may move the offered uplink by at most 10 % (the requirement). drain_max_ms is derived again from runs 1793567507448 (e8bcd00), 1793570766606, 1793571115177 (c6d2a3f with the ingest work uncommitted), 1793572869578 and 1793573215128 (c777883): the drain paused the video 4216-5547 ms, against 3161-4040 ms in 1793552548374 (c63d5a1), 1793554820615 (641d33e) and 1793557610246 (0d99d77). The pause still ends when the queue has drained; why the drains got longer is not established. drain_max_ms is derived once more from the final path, with the vehicle pacing its video (5202b5c): runs 1793628066477, 1793628193743, 1793628348070 and 1793629621483 (gate-full) paused the video 2837-5058 ms, so the drains did not get shorter against 4216-5547 ms in a way the runs show (the ranges overlap). Same rule: 1.25 x 5058 + 10 ms, rounded up to 5 ms."""
max = { settle_max_ms = 2805.0, over_cap_windows = 0.0, age_over_base_max_ms = 15.0, age_recovery_max_ms = 9525.0, drain_max_ms = 6335.0, transitions_per_min = 6.0, viewer_change_percent = 10.0 }

