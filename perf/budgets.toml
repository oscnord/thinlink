rationale = """Runs 1793585101409, 1793585210328, 1793585320482 (0812a9e with the check as committed in e0845d8). Container-only, the simulated flight under the geo profile, otherwise as for lan. Worst measured: Brake 1536 ms after the vehicle's last applied setpoint (1493, 1536 and, in one run, 62 ms: the copter already reported Brake when the stream stopped), Land 2810 ms after it (2661-2810), on the ground and disarmed 31323 ms after it (30890-31323), a sag of 0.02 m in Brake and 0.01 m before Land, and the video Live over 83.3 %, 64.0 % and 100 % of the leg's frames (age p50 316-318 ms, p95 324-333 ms, 6.9-16.0 new frames/s, recorded not graded). The Live share varies from run to run and its cause is not established (the uplink's queue delay is a candidate, docs/simulation.md); the floor is the house rule on the lowest run. Rule: times 1.25 x worst + 10 ms rounded up to 5 ms; sags 1.25 x worst + 0.1 m rounded up to 0.1 m; Live share 0.95 x worst rounded down to 0.01."""
max = { brake_ms = 1930.0, brake_sag_m = 0.2, land_ms = 3525.0, land_sag_m = 0.2, on_ground_ms = 39165.0 }
min = { video_live_ratio = 0.6 }

[qgc-status.lan]
status = "enforced"
rationale = """Runs 1793518904145, 1793519088922, 1793519246858 (e72ac9f), alternating with the geo, outage-10s runs, with the output repeating a frame only when nothing went out for two periods or the state is due to change. Container-only, the ground's freshness output at 640x360/15 fps/2000 kbit/s received in checks like QGC. Worst measured: pause_stale_ms 577.9, pause_disconnected_ms 1984.7, freeze_frozen_ms 550.5, pause_recovery_ms 60.6, freeze_recovery_ms 68.5, pause_gap_max_ms 135.5, freeze_gap_max_ms 71.5, output_added_ms 3.0. Live share of the healthy window 1.000. Rule: times, the longest wait for an output frame during a stall (now the two-period repeat, 133 ms, plus scheduling) and the added latency 1.25 x worst + 10 ms rounded up to 5 ms; recoveries the same; Live share 0.95 x worst rounded down to 0.01."""
max = { pause_stale_ms = 735.0, pause_disconnected_ms = 2495.0, freeze_frozen_ms = 700.0, pause_recovery_ms = 90.0, freeze_recovery_ms = 100.0, pause_gap_max_ms = 180.0, freeze_gap_max_ms = 100.0, output_added_ms = 15.0 }
min = { live_ratio = 0.95 }

