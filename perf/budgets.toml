# Acceptance budgets for `lab check`, per scenario and profile: [<scenario>.<profile>].
# docs/measurement.md defines the metrics and how budgets are graded.
#
# status = "calibration": measured and recorded, never graded; the run is incomplete (exit 2).
# status = "enforced": every limit in `max` and `min` is graded; an unmeasured metric is
# incomplete. An enforced budget cites the runs its limits come from in `rationale`.

[skeleton.lan]
status = "enforced"
rationale = """Runs 1793490193926, 1793490274082 (2642565); 1793490409327 (33ef4e6); 1793490906111 (0a5a1f7); 1793491062261 (7054d8a); 1793492287136, 1793492325271 (c4f5eed). Container-only, ball pattern at 640x360/15 fps/500 kbit/s. Worst measured: frame age p95 11 ms, max 39 ms (three frames at 31-39 ms within 0.3 s of one run while p50 stayed 7 ms, a scheduling stall on the shared 2 GiB VM), 14.99 new frames/s, longest gap 105 ms, no unreadable stamps, recovery frame age 69 ms (recovery 93-1837 ms). Rule: age and gap limits 1.25 x worst + 10 ms rounded up to 5 ms; unreadable ratio 1.25 x worst + 0.01; frame rate 0.95 x worst rounded down to 0.5; recovery waits for the next keyframe, so 1.25 x (2000 ms keyframe interval + worst recovery frame age) rounded up to 5 ms."""
max = { frame_age_p95_ms = 25.0, frame_age_max_ms = 60.0, max_frame_gap_ms = 145.0, unreadable_ratio = 0.01, video_recovery_ms = 2590.0 }
min = { new_frames_per_s = 14.0 }

[skeleton.lte-good]
status = "calibration"

[skeleton.lte-bad]
